<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LEGO SPIKE USB Controller</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; text-align: center; padding: 30px; }
        button { background: #ffcc00; color: #000; border: none; padding: 15px 30px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 15px; }
        button:hover { background: #e6b800; }
        .box { background: #1e1e1e; padding: 25px; border-radius: 12px; display: inline-block; margin-top: 20px; width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .status { font-weight: bold; margin: 12px 0; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Controlador LEGO SPIKE Prime (USB)</h1>
    
    <div class="box">
        <h3>Conexión del Hub</h3>
        <button id="connectBtn">Conectar Hub (USB)</button>
        <div id="hubStatus" class="status" style="color: #ff4444;">Desconectado</div>
    </div>

    <br>

    <div class="box">
        <h3>Estado del Mando</h3>
        <div id="gpStatus" class="status" style="color: #ff4444;">Pulsa cualquier botón del mando</div>
    </div>

    <script>
        let serialPort = null;
        let serialWriter = null;
        let connected = false;

        document.getElementById('connectBtn').addEventListener('click', async () => {
            try {
                // Solicitar puerto serie USB al navegador
                serialPort = await navigator.serial.requestPort();
                await serialPort.open({ baudRate: 115200 });
                serialWriter = serialPort.writable.getWriter();
                connected = true;
                document.getElementById('hubStatusinnerText = "¡Conectado por USB!";
                document.getElementById('hubStatus').style.color = "#00ff00";
            } catch (err) {
                alert("Error al conectar por USB: " + err);
            }
        });

        async function sendCommand(cmdObj) {
            if (!connected || !serialWriter) return;
            try {
                const data = JSON.stringify(cmdObj) + "\n";
                await serialWriter.write(new TextEncoder().encode(data));
            } catch (e) {
                console.error(e);
            }
        }

        // Detección del mando
        window.addEventListener("gamepadconnected", (e) => {
            document.getElementById('gpStatus').innerText = "Conectado: " + e.gamepad.id;
            document.getElementById('gpStatus').style.color = "#00ff00";
        });

        // Bucle de lectura de los joysticks del mando para mover los motores A y B
        setInterval(() => {
            const gamepads = navigator.getGamepads();
            if (!gamepads[0]) return;
            const gp = gamepads[0];
            
            // Eje vertical izquierdo para avanzar/retroceder (-1 arriba, 1 abajo)
            let throttle = -gp.axes[1] * 100; 
            let steering = (gp.axes[2] !== undefined ? gp.axes[2] : gp.axes[3]) * 50;   // Eje horizontal para girar

            let leftSpeed = Math.round(throttle + steering);
            let rightSpeed = Math.round(throttle - steering);

            // Limitar valores entre -100 y 100
            leftSpeed = Math.max(-100, Math.min(100, leftSpeed));
            rightSpeed = Math.max(-100, Math.min(100, rightSpeed));

            if (Math.abs(throttle) > 5 || Math.abs(steering) > 5) {
                sendCommand({ cmd: "motor.run", port: "A", speed: leftSpeed });
                sendCommand({ cmd: "motor.run", port: "B", speed: rightSpeed });
            } else {
                sendCommand({ cmd: "motor.stop", port: "A" });
                sendCommand({ cmd: "motor.stop", port: "B" });
            }
        }, 50);
    </script>
</body>
</html>
